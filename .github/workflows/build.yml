name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            req: requirements-win.txt
          - os: macos-14          # Apple Silicon runner
            name: macos-arm64
            req: requirements-mac.txt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.req }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.req }}

      - name: Selftest (source)
        run: python -m app.engine --selftest

      - name: Build
        run: pyinstaller build/transkrib.spec --noconfirm --clean

      # Windowed exe не блокирует консоль — ждём процесс и читаем selftest.log
      - name: Selftest (built exe, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Transkrib\Transkrib.exe" -ArgumentList "--selftest" -Wait -PassThru -WorkingDirectory (Get-Location)
          Get-Content selftest.log
          if ($p.ExitCode -ne 0) { throw "selftest exit code $($p.ExitCode)" }
          if (-not (Select-String -Path selftest.log -Pattern "SELFTEST OK" -Quiet)) { throw "SELFTEST OK not found" }

      - name: Selftest (built app, macOS)
        if: runner.os == 'macOS'
        run: |
          ./dist/Transkrib.app/Contents/MacOS/Transkrib --selftest
          grep -q "SELFTEST OK" selftest.log

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Transkrib -DestinationPath Transkrib-${{ matrix.name }}.zip
          Get-Item Transkrib-${{ matrix.name }}.zip | Select-Object Name, @{n="MB";e={[math]::Round($_.Length/1MB)}}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep -s - dist/Transkrib.app
          ditto -c -k --keepParent dist/Transkrib.app Transkrib-${{ matrix.name }}.zip
          ls -la Transkrib-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Transkrib-${{ matrix.name }}
          path: Transkrib-${{ matrix.name }}.zip
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          generate_release_notes: true
