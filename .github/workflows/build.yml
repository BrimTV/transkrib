name: build

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Новый пуш в ветку отменяет предыдущую сборку: она собирает уже устаревший код,
# а четыре задания держат раннеры по четверти часа. Сборки по тегу не трогаем —
# из них делается релиз, отменять их нельзя.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.variant }} / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Самая долгая честная сборка — около 15 минут. Потолок нужен не для скорости,
    # а чтобы зависшее окно не крутилось шесть часов подряд на каждом варианте.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [lite, medium]       # lite: small внутри, только CPU. medium: medium внутри, на Windows + CUDA
        os: [windows-latest, macos-14]   # macos-14 = Apple Silicon
        include:                      # только добавляет поля к комбинациям, не создаёт новых
          - os: windows-latest
            name: windows-x64
            req: requirements.txt
          - os: macos-14
            name: macos-arm64
            req: requirements-mac.txt
    steps:
      - uses: actions/checkout@v4

      # Версия в одном месте (app/__init__.py читает TRANSKRIB_VERSION), но само
      # значение вычисляет CI: по тегу vX.Y.Z — версия из тега, иначе базовая
      # версия из app/__init__.py плюс короткий хеш коммита (чтобы отличать
      # автосборки с main друг от друга). shell: bash — работает одинаково на
      # windows-latest (входит в состав раннера Git for Windows) и macos-14.
      - name: Compute version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            BASE=$(python3 -c "import app; print(app.__version__)")
            SHA=$(git rev-parse --short=7 HEAD)
            VERSION="${BASE}+${SHA}"
          fi
          echo "TRANSKRIB_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "[version] $VERSION"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements*.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.req }}

      - name: Install CUDA runtime (medium, Windows)
        if: matrix.variant == 'medium' && runner.os == 'Windows'
        run: pip install -r requirements-win.txt

      - name: Tests
        # python -m, а не голый pytest: иначе tests/*.py не видят пакет app —
        # его каталог добавляет в sys.path именно запуск через -m (see local repro).
        run: python -m pytest -q -m "not slow"

      - name: Fetch bundled model
        run: python build/fetch_model.py ${{ matrix.variant == 'lite' && 'small' || 'medium' }} ${{ matrix.variant }}

      - name: Selftest (source, bundled model)
        run: python -m app.engine --selftest

      - name: Build
        run: pyinstaller build/transkrib.spec --noconfirm --clean

      # Windowed exe не блокирует консоль — ждём процесс и читаем selftest.log из
      # data_dir() (папка exe бывает только для чтения, поэтому не рядом с exe).
      - name: Selftest (built exe, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Transkrib\Transkrib.exe" -ArgumentList "--selftest" -Wait -PassThru -WorkingDirectory (Get-Location)
          $log = "$env:LOCALAPPDATA\Transkrib\selftest.log"
          Get-Content $log
          if ($p.ExitCode -ne 0) { throw "selftest exit code $($p.ExitCode)" }
          if (-not (Select-String -Path $log -Pattern "SELFTEST OK" -Quiet)) { throw "SELFTEST OK not found" }

      - name: Selftest (built app, macOS)
        if: runner.os == 'macOS'
        run: |
          ./dist/Transkrib.app/Contents/MacOS/Transkrib --selftest
          log="$HOME/Library/Application Support/Transkrib/selftest.log"
          grep -q "SELFTEST OK" "$log"

      # Проверка --check-env на собранном приложении: через консольный exe (A6),
      # чтобы не плясать со Start-Process и файлом вывода.
      - name: Check env (built exe, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "dist\Transkrib\Transkrib-console.exe" --check-env
          if ($LASTEXITCODE -ne 0) { throw "check-env exit code $LASTEXITCODE" }

      - name: Check env (built app, macOS)
        if: runner.os == 'macOS'
        run: ./dist/Transkrib.app/Contents/MacOS/Transkrib-console --check-env

      # Имя архива короткое (без -windows-x64): длинные пути после распаковки —
      # отдельная головная боль Windows (см. блок A7). ЧИТАЙ.txt кладём в корень
      # архива рядом с папкой Transkrib, не внутрь неё — так его видно сразу.
      # -mcu=on обязателен: без него имя ЧИТАЙ.txt (кириллица) на нерусской
      # Windows превращается в кракозябры.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item build\README-windows.txt dist\ЧИТАЙ.txt
          $zip = "Transkrib-${{ matrix.variant }}-windows.zip"
          7z a -tzip -mx=3 -mcu=on $zip .\dist\Transkrib .\dist\ЧИТАЙ.txt | Out-Null
          Get-Item $zip | Select-Object Name, @{n="MB";e={[math]::Round($_.Length/1MB)}}
          echo "ZIP_NAME=$zip" >> $env:GITHUB_ENV

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          # Подпись «для себя» (ad-hoc): без неё macOS считает приложение
          # повреждённым. От предупреждения о непроверенном разработчике она не
          # спасает — как его пройти, написано в ЧИТАЙ.txt, и он обязан лежать
          # рядом с приложением, иначе человек упрётся в это на первом же запуске.
          codesign --force --deep -s - dist/Transkrib.app
          rm -rf pack && mkdir -p pack/Transkrib
          cp -R dist/Transkrib.app pack/Transkrib/
          cp build/README-macos.txt pack/Transkrib/ЧИТАЙ.txt
          zip="Transkrib-${{ matrix.variant }}-mac.zip"
          ditto -c -k --sequesterRsrc --keepParent pack/Transkrib "$zip"
          ls -la Transkrib-*.zip
          echo "ZIP_NAME=$zip" >> "$GITHUB_ENV"

      - name: Проверка состава архива (macOS)
        if: runner.os == 'macOS'
        run: |
          rm -rf archive_check && mkdir archive_check
          ditto -x -k "$ZIP_NAME" archive_check
          test -f "archive_check/Transkrib/ЧИТАЙ.txt" || { echo "ЧИТАЙ.txt отсутствует в архиве"; exit 1; }
          test -x "archive_check/Transkrib/Transkrib.app/Contents/MacOS/Transkrib" || { echo "приложение отсутствует в архиве"; exit 1; }
          codesign --verify --deep archive_check/Transkrib/Transkrib.app || { echo "подпись не прошла проверку"; exit 1; }
          echo "OK: приложение, инструкция и подпись на месте"

      # ── Проверки собранного пакета (Windows) ──────────────────────────────
      # Всё ниже нельзя перепроверить на маке разработчиков — это единственное
      # место, где баги A1/A6 (кодовая страница, манифест, версия, DLL) вообще
      # можно поймать до того, как их найдёт живой пользователь.

      - name: Проверка состава архива (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force archive_check -ErrorAction SilentlyContinue
          7z x $env:ZIP_NAME -oarchive_check -y | Out-Null
          if (-not (Test-Path "archive_check\ЧИТАЙ.txt")) { throw "ЧИТАЙ.txt отсутствует в архиве" }
          if (-not (Test-Path "archive_check\Transkrib\Transkrib.exe")) { throw "Transkrib\Transkrib.exe отсутствует в архиве" }
          Write-Host "OK: ЧИТАЙ.txt и Transkrib\Transkrib.exe на месте"
          Remove-Item -Recurse -Force archive_check

      - name: Манифест содержит activeCodePage (Windows)
        if: runner.os == 'Windows'
        shell: python
        run: |
          from PyInstaller.utils.win32 import winmanifest
          for exe in ("dist/Transkrib/Transkrib.exe", "dist/Transkrib/Transkrib-console.exe"):
              data = winmanifest.read_manifest_from_executable(exe)
              text = data.decode("utf-8")
              assert "activeCodePage" in text, f"activeCodePage не найден в манифесте {exe}"
              print(f"[ci] {exe}: activeCodePage на месте")

      - name: VC++ runtime DLL на месте (Windows)
        if: runner.os == 'Windows'
        shell: python
        run: |
          import pathlib, sys
          internal = pathlib.Path("dist/Transkrib/_internal")
          need = ["msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll"]
          have = {p.name.lower() for p in internal.rglob("*.dll")}
          missing = [n for n in need if n.lower() not in have]
          if missing:
              sys.exit(f"не найдены DLL VC++ рантайма в {internal}: {missing}")
          print("[ci] VC++ runtime DLL на месте:", need)

      - name: CUDA DLL на месте (medium, Windows)
        if: runner.os == 'Windows' && matrix.variant == 'medium'
        shell: python
        run: |
          import pathlib, sys
          internal = pathlib.Path("dist/Transkrib/_internal")
          need = ["cublas64_12.dll", "cublasLt64_12.dll", "cudnn64_9.dll"]
          have = {p.name.lower() for p in internal.rglob("*.dll")}
          missing = [n for n in need if n.lower() not in have]
          if missing:
              sys.exit(f"не найдены DLL CUDA в {internal}: {missing}")
          print("[ci] CUDA DLL на месте:", need)

      - name: Сведения о версии у exe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($name in @("Transkrib.exe", "Transkrib-console.exe")) {
            $vi = (Get-Item "dist\Transkrib\$name").VersionInfo
            Write-Host "$name ProductVersion=$($vi.ProductVersion) FileVersion=$($vi.FileVersion)"
            if ([string]::IsNullOrWhiteSpace($vi.ProductVersion)) { throw "${name}: ProductVersion пуст" }
            if ($vi.ProductVersion -ne $env:TRANSKRIB_VERSION) {
              throw "${name}: ProductVersion '$($vi.ProductVersion)' != ожидаемого '$($env:TRANSKRIB_VERSION)'"
            }
          }

      # Честное воспроизведение бага A1: раннер сам по себе не русский (ACP по
      # умолчанию не 65001), поэтому без activeCodePage в манифесте этот шаг
      # обязан падать на загрузке модели по кириллическому пути. LOCALAPPDATA
      # и TEMP тоже кириллические — ровно так, как у обычного пользователя.
      - name: Самопроверка по кириллическому пути (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $base = "D:\Тест кириллицы ~ путь"
          New-Item -ItemType Directory -Force "$base\Лок","$base\Врем" | Out-Null
          Expand-Archive $env:ZIP_NAME $base -Force
          $env:LOCALAPPDATA = "$base\Лок"
          $env:TEMP = "$base\Врем"
          $env:TMP = "$base\Врем"

          $p = Start-Process -FilePath "$base\Transkrib\Transkrib.exe" -ArgumentList "--selftest" -Wait -PassThru -WorkingDirectory $base
          $log = "$base\Лок\Transkrib\selftest.log"
          Get-Content $log
          if ($p.ExitCode -ne 0) { throw "selftest exit code $($p.ExitCode)" }
          if (-not (Select-String -Path $log -Pattern "SELFTEST OK" -Quiet)) { throw "SELFTEST OK не найден в $log" }
          if (-not (Test-Path "$base\Лок\Transkrib")) { throw "лог не появился в $base\Лок\Transkrib" }

          # ACP=65001 — маркер, что наш манифест реально применился к процессу.
          & "$base\Transkrib\Transkrib-console.exe" --check-env
          $envLog = "$base\Лок\Transkrib\transkrib.log"
          if (-not (Select-String -Path $envLog -Pattern "ACP=65001" -Quiet)) {
            throw "ACP=65001 не найден в $envLog — манифест не применился"
          }
          Write-Host "OK: кириллический путь, ACP=65001"

      # Проводник помечает распакованные файлы как «из интернета», и .NET
      # отказывается грузить такие сборки (ошибка 0x80131515) — окно просто не
      # открывается. Проверяем, что самолечение в run.py снимает пометку.
      - name: Пометка «из интернета» не мешает запуску (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force motw_check -ErrorAction SilentlyContinue
          Expand-Archive -Path $env:ZIP_NAME -DestinationPath motw_check
          Get-ChildItem -Path motw_check -Recurse -Include *.dll,*.pyd,*.exe | ForEach-Object {
            Set-Content -Path $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
          $marked = (Get-ChildItem -Path motw_check -Recurse -Include *.dll | Select-Object -First 1).FullName
          $markedExe = "motw_check\Transkrib\Transkrib-console.exe"
          Write-Host "помечено, пример: $marked"
          if (-not (Get-Item -Path $markedExe -Stream Zone.Identifier -ErrorAction SilentlyContinue)) {
            throw "проверка бессмысленна: exe не помечен"
          }
          & "motw_check\Transkrib\Transkrib-console.exe" --check-env
          if ($LASTEXITCODE -ne 0) { throw "с пометкой из интернета не запустилось, код $LASTEXITCODE" }
          $left = Get-Item -Path $marked -Stream Zone.Identifier -ErrorAction SilentlyContinue
          if ($left) { throw "пометка Zone.Identifier осталась на $marked" }
          Write-Host "OK: пометка снята, приложение запускается"

      # Ни один запуск не должен ходить в сеть: модель вшита в пакет. Глухой прокси
      # ловит любую попытку — у человека без интернета всё обязано работать.
      # Единственная проверка, которая реально открывает окно: создаёт его, дожидается
      # загрузки страницы, дёргает мост Python↔JS как это делает интерфейс, проверяет
      # подписку на перетаскивание файлов и закрывается. Всё остальное в CI headless,
      # а именно окно и WebView2 — самое хрупкое место на чужой Windows.
      - name: Окно открывается и мост жив (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 8
        run: |
          # Не `& exe` напрямую: PowerShell ждал бы процесс без конца, а однажды он
          # завис после загрузки страницы и сжёг шесть часов раннера. Ждём с
          # ограничением, добиваем и всё равно читаем лог — по нему видно, докуда дошло.
          $log = "$env:LOCALAPPDATA\Transkrib\smoke.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "dist\Transkrib\Transkrib-console.exe" -ArgumentList "--smoke" -PassThru -NoNewWindow
          if (-not $p.WaitForExit(180000)) {
            Write-Host "smoke не завершился за 180 с, снимаю процесс"
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $log) { Get-Content $log }
            throw "окно не закрылось само за 180 с"
          }
          if (-not (Test-Path $log)) { throw "smoke.log не появился, код выхода $($p.ExitCode)" }
          Get-Content $log
          if ($p.ExitCode -ne 0) { throw "окно не открылось, код $($p.ExitCode)" }
          foreach ($needle in @("READY", "OK", "DND_DISPATCHED")) {
            if (-not (Select-String -Path $log -Pattern $needle -Quiet)) { throw "в smoke.log нет $needle" }
          }
          Write-Host "OK: окно, мост и перетаскивание живы"

      - name: Окно открывается и мост жив (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 8
        run: |
          ./dist/Transkrib.app/Contents/MacOS/Transkrib-console --smoke
          log="$HOME/Library/Application Support/Transkrib/smoke.log"
          cat "$log"
          for needle in READY OK DND_DISPATCHED; do
            grep -q "$needle" "$log" || { echo "в smoke.log нет $needle"; exit 1; }
          done
          echo "OK: окно, мост и перетаскивание живы"

      - name: Работа без интернета (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          & "dist\Transkrib\Transkrib-console.exe" --selftest
          if ($LASTEXITCODE -ne 0) { throw "без интернета самопроверка не прошла, код $LASTEXITCODE" }
          Write-Host "OK: без интернета работает"

      - name: Работа без интернета (macOS)
        if: runner.os == 'macOS'
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          ./dist/Transkrib.app/Contents/MacOS/Transkrib-console --selftest
          echo "OK: без интернета работает"

      - uses: actions/upload-artifact@v4
        with:
          name: Transkrib-${{ matrix.variant }}-${{ matrix.name }}
          path: ${{ env.ZIP_NAME }}
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          body_path: build/RELEASE-NOTES.md
          generate_release_notes: true
